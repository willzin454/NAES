{% extends 'website/modelo.html' %}

{% load crispy_forms_tags %}

{% block title %}
  Curso
{% endblock %}

{% block conteudo %}
  <div class="container">
    <div class="card shadow p-4">
      <h2 class="mb-4">
        {% if form.instance.pk %}
          Editar Curso
        {% else %}
          Novo Curso
        {% endif %}
      </h2>

      <form method="POST">
        {% csrf_token %}

        {{ form|crispy }}

        <button class="btn btn-success">Salvar</button>

        <a href="{% url 'lista_cursos' %}" class="btn btn-secondary">Voltar</a>
      </form>
    </div>
  </div>
{% endblock %}
